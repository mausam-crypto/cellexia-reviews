# Cellexia Reviews — Shopify app configuration template.
# ---------------------------------------------------------------------------
# This file is complete except for `client_id`. Run `npm run config:link` to
# link this project to an app on your Partner account — the CLI writes
# shopify.app.toml (including client_id) for you. Verify the generated file
# keeps the [app_proxy] and [webhooks] sections below, and replace every
# YOUR-APP-URL with the public HTTPS URL of your deployed backend.
# Docs: https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration

name = "Cellexia Reviews"
handle = "cellexia-reviews"
# client_id = ""  # filled in by `npm run config:link`
application_url = "https://YOUR-APP-URL"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# read_markets is OPTIONAL (since 1.14.0): it lets the Dashboard list your
# Shopify Markets by name for the "go live in selected markets" picker.
# Without it the picker still works via detected/manual market handles.
# Removing it from this line is safe.
#
# write_content is OPTIONAL (since 1.19.0): it lets the "Reviews page" screen
# CREATE /pages/cellexia-reviews for you with one click (Admin API pageCreate
# requires write_content or write_online_store_pages). Without it the app
# detects the missing permission and shows the 30-second manual steps
# instead — nothing else in the app uses it.
#
# NOTE: changing this line changes the app's permissions, so Shopify asks the
# merchant to approve the app again on the next install/open. Deploy the app,
# then open it once in the Shopify admin and accept the prompt.
scopes = "read_orders,read_products,write_products,read_files,write_files,read_markets,write_content"

[auth]
redirect_urls = [
  "https://YOUR-APP-URL/auth/callback",
  "https://YOUR-APP-URL/auth/shopify/callback",
  "https://YOUR-APP-URL/api/auth/callback"
]

[webhooks]
# Must match the Admin API version the app's runtime client uses
# (app/shopify.server.ts pins LATEST_API_VERSION from @shopify/shopify-api,
# which is 2025-07 for the version in package.json). A mismatch means webhook
# payloads arrive shaped for a different version than the code expects.
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/gdpr"

# App proxy — the address the storefront widget calls on the shop's own domain
# (https://<shop-domain>/apps/<subpath>/api/...), which Shopify signs and forwards
# to the `url` below.
#
# Any subpath works: the theme extension does not hard-code it. On install — and
# whenever you run Dashboard -> "Test storefront connection", or
# `npm run selftest -- --shop=<store>.myshopify.com` — the app probes
# /apps/<candidate>/api/ping on the shop domain, detects the subpath Shopify is
# actually serving, and stores it in the shop metafield `cellexia.proxy_path`.
# extensions/cellexia-reviews/snippets/cx-proxy.liquid reads that metafield (and
# falls back to "cellexia-reviews"), and the storefront JS re-discovers the path
# by itself if a request ever 404s. So this file and the storefront path cannot
# drift apart — the failure mode that produced silent 404s before v1.6.0.
#
# Keep the default unless another app already owns /apps/cellexia-reviews. If it
# does: change `subpath` here, run `npm run deploy`, then run the storefront
# connection test once so the new path is detected and written to the metafield.
[app_proxy]
url = "https://YOUR-APP-URL/proxy"
prefix = "apps"
subpath = "cellexia-reviews"

[pos]
embedded = false
