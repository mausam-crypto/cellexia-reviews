databases:
  - name: cellexia-reviews-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: cellexia-reviews
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cellexia-reviews-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_orders,read_products,write_products,read_files,write_files
      - key: SHOPIFY_APP_URL
        sync: false
      - key: CELLEXIA_CLIENT_IP_HEADER
        value: true-client-ip
